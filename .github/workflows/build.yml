name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    strategy:
      matrix:
        configuration: [Debug, Release]
        platform: [x64]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
    
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1
    
    - name: Restore NuGet packages
      run: nuget restore WarlockLib.sln
    
    - name: Build
      run: msbuild WarlockLib.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }}
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: WarlockLib-${{ matrix.configuration }}-${{ matrix.platform }}
        path: Build/${{ matrix.configuration }}/

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Run clang-format check
      run: |
        sudo apt-get install clang-format
        find . -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror
